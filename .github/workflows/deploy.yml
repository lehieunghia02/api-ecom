name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - uat
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - production

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom

jobs:
  build-and-deploy-uat:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'uat' || github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    name: Build & Deploy UAT
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:uat
            ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:uat-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to UAT VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_SSH_HOST }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.UAT_SSH_PORT }}
          script: |
            cd ${{ secrets.UAT_DEPLOY_PATH }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:uat
            docker compose -f docker-compose.uat.yml down
            docker compose -f docker-compose.uat.yml up -d
            docker system prune -f

  build-and-deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build & Deploy Production
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:production
            ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/api-ecom:production
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d
            docker system prune -f
